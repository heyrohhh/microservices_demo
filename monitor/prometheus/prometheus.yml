global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager.local:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus.local:9090']


  - job_name: redis
    static_configs:
      - targets: ['redis-exporter.local:9121']

 
  - job_name: frontend
    metrics_path: /metrics
    static_configs:
      - targets: ['frontend.local:8080']
