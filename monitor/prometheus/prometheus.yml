global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
 
  - job_name: frontend
    metrics_path: /metrics
    static_configs:
      - targets: ['frontend:8080']
