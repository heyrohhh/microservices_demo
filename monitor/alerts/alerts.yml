groups:
- name: frontend-alert
  rules:
  - alert: FrontendDown
    expr: up{job="frontend"} == 0
    for: 30s
    labels:
      severity: critical
    annotations:
          summary: frontend is down
          description: Frontend has been unreachable for 30 seconds
  - alert: TelegramTest
    expr: vector(1)
    for: 10s
    labels:
     severity: critical
    annotations:
     summary: Telegram test alert
     description: If you see this, Telegram is wired correctly
